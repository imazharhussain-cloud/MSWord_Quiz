<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مائیکروسافٹ ورڈ کوئز</title>
<style>
:root {
--primary-color: #0056b3; /* Microsoft Blue */
--secondary-color: #f4f7f6;
--correct-color: #28a745;
--wrong-color: #dc3545;
--text-color: #333;
}

body {
font-family: 'Noto Nastaliq Urdu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: var(--secondary-color);
color: var(--text-color);
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
padding: 20px;
box-sizing: border-box;
}

#quiz-container {
background-color: #fff;
padding: 40px;
border-radius: 15px;
box-shadow: 0 10px 25px rgba(0,0,0,0.1);
width: 100%;
max-width: 600px;
text-align: center;
}

h1 {
color: var(--primary-color);
margin-bottom: 30px;
font-size: 2em;
}

#question-counter {
font-size: 1.1em;
margin-bottom: 20px;
color: #666;
}

#question-text {
font-size: 1.4em;
margin-bottom: 30px;
font-weight: bold;
}

#options-container {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 20px;
margin-bottom: 30px;
}

.option-btn {
background-color: #fff;
border: 2px solid #ddd;
padding: 15px 20px;
font-size: 1.1em;
border-radius: 10px;
cursor: pointer;
transition: all 0.3s ease;
font-family: inherit;
}

.option-btn:hover {
border-color: var(--primary-color);
background-color: #eef5ff;
}

.option-btn.selected {
background-color: var(--primary-color);
color: #fff;
border-color: var(--primary-color);
}

#action-btn {
background-color: var(--correct-color);
color: #fff;
border: none;
padding: 15px 40px;
font-size: 1.2em;
border-radius: 10px;
cursor: pointer;
transition: background-color 0.3s ease;
font-family: inherit;
}

#action-btn:hover {
background-color: #218838;
}

#action-btn:disabled {
background-color: #ccc;
cursor: not-allowed;
}

#result-container {
display: none;
}

#result-header {
font-size: 2em;
margin-bottom: 20px;
font-weight: bold;
}

#score-display {
font-size: 3em;
font-weight: bold;
margin-bottom: 10px;
color: var(--primary-color);
}

#pass-fail-message {
font-size: 1.4em;
margin-bottom: 30px;
}

.pass { color: var(--correct-color); }
.fail { color: var(--wrong-color); }

</style>
</head>
<body>

<div id="quiz-container">
<div id="quiz-content">
<h1>مائیکروسافٹ ورڈ کوئز</h1>
<div id="question-counter">سوال <span id="current-question-num">1</span>/10</div>
<div id="question-text"></div>
<div id="options-container">
<button class="option-btn" onclick="selectOption(0)"></button>
<button class="option-btn" onclick="selectOption(1)"></button>
<button class="option-btn" onclick="selectOption(2)"></button>
<button class="option-btn" onclick="selectOption(3)"></button>
</div>
<button id="action-btn" onclick="nextQuestion()" disabled>جمع کریں / اگلا</button>
</div>

<div id="result-container">
<h1>آپ کا نتیجہ</h1>
<div id="result-header"></div>
<div id="score-display"></div>
<div id="breakdown-display"></div>
<div id="pass-fail-message"></div>
<button id="action-btn" onclick="resetQuiz()">دوبارہ کوشش کریں</button>
</div>
</div>

<script>
const questions = [
{
q: "**ٹیکسٹ کو کاپی کرنے کے لیے کون سا کی بورڈ شارٹ کٹ استعمال ہوتا ہے؟**",
options: ["Ctrl + C", "Ctrl + V", "Ctrl + X", "Ctrl + Z"],
correct: 0
},
{
q: "**ٹیکسٹ کو ترچھا (lean) کرنے کے لیے کون سا بٹن دبایا جاتا ہے؟**",
options: ["Bold", "Italic", "Underline", "Font Color"],
correct: 1
},
{
q: "**صفحہ کی کون سی سمت (orientation) آپ کے دستاویز کو چوڑائی سے زیادہ لمبا بناتی ہے؟**",
options: ["Landscape", "Portrait", "Square", "Tall"],
correct: 1
},
{
q: "**املا (spelling) اور گرامر کی غلطیوں کو درست کرنے میں کون سا ٹول مدد کرتا ہے؟**",
options: ["Find", "Replace", "Spelling & Grammar", "Word Count"],
correct: 2
},
{
q: "**دستاویز کو محفوظ (Save) کرنے کا شارٹ کٹ کیا ہے؟**",
options: ["Ctrl + S", "Ctrl + O", "Ctrl + P", "Ctrl + N"],
correct: 0
},
{
q: "**اگر آپ غلطی سے کوئی لفظ ڈیلیٹ کر دیں، تو کون سا شارٹ کٹ آپ کے آخری کام کو کالعدم (Undo) کر دیتا ہے؟**",
options: ["Ctrl + Y", "Ctrl + S", "Ctrl + Z", "Ctrl + V"],
correct: 2
},
{
q: "**نقاط یا علامات کا استعمال کرتے ہوئے ایک ترتیب وار فہرست بنانے کے لیے کون سا فیچر استعمال ہوتا ہے؟**",
options: ["Numbering", "Bullets", "Styles", "Columns"],
correct: 1
},
{
q: "**کمپیوٹر سے تصویر کو ورڈ دستاویز میں کیسے شامل کرتے ہیں؟**",
options: ["داخل کریں > تصاویر", "ہوم > کاپی", "فائل > پرنٹ", "ویو > زوم"],
correct: 0
},
{
q: "**کاپی کیے گئے ٹیکسٹ کو پیسٹ (PASTE) کرنے کے لیے کون سی شارٹ کٹ کی استعمال ہوتی ہے؟**",
options: ["Ctrl + P", "Ctrl + C", "Ctrl + X", "Ctrl + V"],
correct: 3
},
{
q: "**ٹیکسٹ کی کون سی الائنمنٹ (alignment) ٹیکسٹ کو صفحہ کے بالکل بیچ میں رکھتی ہے؟**",
options: ["Left", "Right", "Justify", "Center"],
correct: 3
}
];

let currentQuestionIndex = 0;
let score = 0;
let selectedOptionIndex = null;

const quizContent = document.getElementById('quiz-content');
const resultContainer = document.getElementById('result-container');
const questionText = document.getElementById('question-text');
const optionBtns = document.querySelectorAll('.option-btn');
const actionBtn = document.getElementById('action-btn');
const currentQuestionNumDisplay = document.getElementById('current-question-num');
const resultHeader = document.getElementById('result-header');
const scoreDisplay = document.getElementById('score-display');
const breakdownDisplay = document.getElementById('breakdown-display');
const passFailMessage = document.getElementById('pass-fail-message');

function loadQuestion() {
selectedOptionIndex = null;
actionBtn.disabled = true;
actionBtn.innerText = currentQuestionIndex === questions.length - 1 ? "ختم کریں" : "جمع کریں / اگلا";

const currentQuestion = questions[currentQuestionIndex];
currentQuestionNumDisplay.innerText = currentQuestionIndex + 1;
questionText.innerHTML = currentQuestion.q;

optionBtns.forEach((btn, index) => {
btn.innerText = currentQuestion.options[index];
btn.classList.remove('selected');
});
}

function selectOption(index) {
selectedOptionIndex = index;
optionBtns.forEach((btn, i) => {
if (i === index) {
btn.classList.add('selected');
} else {
btn.classList.remove('selected');
}
});
actionBtn.disabled = false;
}

function nextQuestion() {
if (selectedOptionIndex === questions[currentQuestionIndex].correct) {
score++;
}

currentQuestionIndex++;

if (currentQuestionIndex < questions.length) {
loadQuestion();
} else {
showResults();
}
}

function showResults() {
quizContent.style.display = 'none';
resultContainer.style.display = 'block';

const percentage = (score / questions.length) * 100;
scoreDisplay.innerText = `%${percentage}`;
breakdownDisplay.innerText = `درست جوابات: ${score} | غلط جوابات: ${questions.length - score}`;

if (percentage >= 50) {
resultHeader.innerText = "مبارک ہو!";
passFailMessage.innerText = "آپ کامیاب ہو گئے ہیں!";
passFailMessage.className = "pass";
} else {
resultHeader.innerText = "کوشش جاری رکھیں!";
passFailMessage.innerText = "آپ کو مزید مشق کی ضرورت ہے۔";
passFailMessage.className = "fail";
}
}

function resetQuiz() {
currentQuestionIndex = 0;
score = 0;
quizContent.style.display = 'block';
resultContainer.style.display = 'none';
loadQuestion();
}

// Initial load
loadQuestion();

</script>

</body>
</html>
